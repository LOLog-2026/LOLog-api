# 학교 Nginx에 넣을 설정. 서버의 ~/nginx/lolog.java21.net.conf로 복사하고 강사님께 적용을 요청한다.
# <학번>과 <GATEWAY_PORT>를 바꾼다. GATEWAY_PORT는 deploy/.env의 값과 같아야 한다.
server {
    listen 80;
    server_name lolog.java21.net;

    access_log /home/aiot3/<학번>/nginx/logs/lolog.java21.net.access.log;
    error_log  /home/aiot3/<학번>/nginx/logs/lolog.java21.net.error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:<GATEWAY_PORT>;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
