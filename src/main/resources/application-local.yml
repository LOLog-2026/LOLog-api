# 로컬 개발용 설정. 접속 값은 compose.yaml과 맞춘다.
spring:
  config:
    # Spring은 .env를 자동으로 읽지 않으므로 직접 불러온다. 프로젝트 루트에서 실행해야 찾는다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/lolog_api
    username: myuser
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      # docker compose up -d로 직접 띄운다. 켜 두면 compose 값이 위 접속 정보를 덮어쓴다.
      enabled: false

lolog:
  auth:
    # 앱의 local.properties에 있는 LOLOG_TEST_TOKEN과 같은 값을 쓴다.
    dev-test-token: ${LOLOG_TEST_TOKEN}
  # 로컬 SeaweedFS(compose.yaml). 접근 키(S3_ACCESS_KEY, S3_SECRET_KEY)는 .env에서 읽는다.
  storage:
    endpoint: http://localhost:8333
    public-endpoint: http://localhost:8333
    bucket: lolog-comics
